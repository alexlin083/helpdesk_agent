name: helpdesk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: helpdesk-backend:latest
    build:
      context: ./backend
    env_file: ${HELPDESK_ENV_FILE:-.env}
    # NODE_ENV 與 CORS_ORIGIN 只由 env_file（HELPDESK_ENV_FILE 指定的檔案）提供；environment 的值會蓋過 env_file，因此這裡不再設定。
    environment:
      PORT: "3000"
      # 需求單存在 SQLite；舊版 tickets.json 只在資料庫第一次初始化（沒有匯入紀錄）時自動匯入，之後保留作為回滾來源；
      # 初始化後才放入的檔案只記錄 legacy-appeared，需用 node scripts/import-legacy-tickets.js --import-late 手動匯入。
      DATABASE_FILE: /app/storage/helpdesk.db
      TICKETS_FILE: /app/storage/tickets.json
      LIMIT_STORE: memory
      # 僅 Caddy 對外；Caddy 覆寫來源資訊，後端只信任這一跳。
      TRUST_PROXY: "1"
      # 單站點架構不使用 CloudFront 來源秘密，避免舊設定阻擋登入。
      ORIGIN_VERIFY_SECRET: ""
      SHUTDOWN_TIMEOUT_MS: "75000"
    volumes:
      - tickets:/app/storage
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    logging: *logging

  web:
    image: helpdesk-web:latest
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  tickets:
  caddy_data:
  caddy_config:
