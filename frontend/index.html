<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="登入企業智慧服務台，提出需求單">
    <title>登入 · 企業智慧服務台</title>
    <link rel="stylesheet" href="./base.css">
    <link rel="stylesheet" href="./login.css">
    <script type="module" src="./src/login.js"></script>
  </head>
  <body class="login-page">
    <aside class="login-hero" aria-labelledby="hero-title">
      <div class="brand brand-light">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 14.5l1.8 1.8 3.4-3.6"/></svg>
        </span>
        <div><p class="brand-name">企業智慧服務台</p><p class="brand-sub">需求單提案</p></div>
      </div>
      <div class="hero-body">
        <h1 id="hero-title" class="hero-title">讓每張需求單，<br>都送到對的人手上</h1>
        <ol class="hero-steps">
          <li><span class="step-index">01</span><span>指定處理人：需求單直接送到對方手上</span></li>
          <li><span class="step-index">02</span><span>未指定處理人：依主題與內容，分派到對應部門簽核</span></li>
        </ol>
      </div>
    </aside>
    <main class="login-main">
      <form id="login-form" class="login-form" novalidate>
        <h2 class="form-title">登入</h2>
        <p class="form-intro">使用公司帳號登入，開始提出需求單</p>
        <div class="field">
          <label for="username">帳號</label>
          <input id="username" name="username" autocomplete="username" placeholder="員工英文姓名（例如 alex.huang）" autofocus>
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
            <button id="password-toggle" class="link-button" type="button" aria-pressed="false" aria-controls="password">顯示</button>
          </div>
        </div>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="primary-button" type="submit">登入</button>
      </form>
    </main>
  </body>
</html>
