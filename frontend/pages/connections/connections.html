<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="企業智慧服務台：連接自己的外部服務帳號，選擇助理可以讀的範圍">
    <title>連接帳號 · 企業智慧服務台</title>
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="./connections.css">
    <script type="module" src="../../src/pages/connections.js"></script>
  </head>
  <body class="connections-page" hidden>
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 14.5l1.8 1.8 3.4-3.6"/></svg>
        </span>
        <div><p class="brand-name">企業智慧服務台</p><p class="brand-sub">需求單提案</p></div>
      </div>
      <nav class="top-nav" aria-label="主要頁面">
        <a href="../propose/propose.html">提出需求單</a>
        <a href="../tickets/tickets.html">狀態追蹤</a>
      </nav>
      <details id="account-menu" class="account-menu">
        <summary class="account-summary" aria-label="帳號選單">
          <span id="account-avatar" class="avatar" aria-hidden="true"></span>
          <span id="account-name" class="account-name"></span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div class="account-panel">
          <p class="account-id"><span class="muted">使用者代號</span><span id="account-id"></span></p>
          <p class="account-id"><span class="muted">所屬部門</span><span id="account-department"></span></p>
          <a class="secondary-button block" href="./connections.html" aria-current="page">連接帳號</a>
          <button id="logout-button" class="secondary-button" type="button">登出</button>
        </div>
      </details>
    </header>

    <main class="connections-layout">
      <div class="connections-head">
        <h1 id="page-title">連接帳號</h1>
        <p class="intro">連接你自己的外部服務帳號後，助理可以在你選的權限內讀取資料；權限隨時可以改，也可以中斷連接</p>
        <p class="privacy-link"><a href="../privacy/privacy.html">隱私權政策</a>：會讀哪些資料、存在哪裡、怎麼收回</p>
      </div>
      <p id="connections-status" class="connections-status" role="status" aria-live="polite"></p>
      <div class="connections-split">
        <nav aria-label="可以連接的服務"><ul id="connector-list" class="connector-list"></ul></nav>
        <section id="connector-detail" class="connector-detail" aria-label="服務詳細內容"></section>
      </div>
    </main>
  </body>
</html>
