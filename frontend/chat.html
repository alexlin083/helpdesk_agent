<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="企業智慧服務台：詢問內部 SOP，查看 Gemini 檢索與分流結果。">
    <title>企業智慧服務台 · Helpdesk Agent</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body hidden>
    <header class="page-header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><div><h1>企業智慧服務台</h1><p>HELPDESK AGENT / 工作上的疑問，從這裡開始。</p></div></div>

    <p id="usage-status" class="usage-status" role="status"></p>

      <section id="decision-panel" class="panel decision-panel" aria-label="Gemini 回覆資料"></section>
    </main>
    <footer class="page-footer">AI 回覆僅供參考，請以企業正式規章為準。工單資料為處置建議，尚未保存或派送。</footer>
